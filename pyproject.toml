[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "czip"
version = "0.1.0"
description = "Lossless compressor for connectome graphs (.cz format) with honest whole-container accounting"
readme = "README.md"
license = "MIT"
authors = [{ name = "Vikas Yarlagadda" }]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "constriction==0.5.0",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
czip = "czip.czip:main"

[tool.hatch.build.targets.wheel]
packages = ["czip"]

[tool.hatch.build.targets.sdist]
include = [
    "/czip",
    "/docs",
    "/examples",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/CITATION.cff",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E402", "E701", "E702", "E731", "E741"]

[tool.ruff.lint.per-file-ignores]
"tests/test_czip_autofit.py" = ["F841"]
"tests/test_weights.py" = ["F841"]

[tool.pytest.ini_options]
testpaths = ["tests"]
